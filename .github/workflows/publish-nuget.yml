name: Publish NuGet Packages

run-name: Publish ${{ inputs.project }} to nuget.org

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project directory to publish
        required: true
        type: choice
        options:
          - deployer
          - migrator
          - packager
          - regular

concurrency:
  group: nuget-publishing
  cancel-in-progress: false

jobs:
  native-linux:
    if: github.ref == 'refs/heads/main' && inputs.project == 'migrator'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Linux executor
        working-directory: migrator
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          podman run --detach --name zongsoft-migrator-aot-builder \
            --volume "$PWD:/workspace" --volume "$PWD/../.editorconfig:/.editorconfig:ro" \
            --volume "$PWD/../Directory.Build.props:/Directory.Build.props:ro" \
            --volume "$PWD/../Directory.Packages.props:/Directory.Packages.props:ro" \
            --volume zongsoft-migrator-aot-cache:/aot \
            --workdir /workspace docker.io/rockylinux/rockylinux:9.8 sleep infinity
          podman exec zongsoft-migrator-aot-builder bash executor/build/setup.sh
          podman exec zongsoft-migrator-aot-builder bash executor/build/publish.sh linux-x64 Release
          podman exec zongsoft-migrator-aot-builder bash executor/build/publish.sh linux-arm64 Release
      - uses: actions/upload-artifact@v6
        with:
          name: executor-linux
          path: |
            migrator/executor/src/bin/Release/net10.0/linux-x64/publish/
            migrator/executor/src/bin/Release/net10.0/linux-arm64/publish/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove build container
        if: always()
        run: podman rm --force --ignore zongsoft-migrator-aot-builder

  native-windows:
    if: github.ref == 'refs/heads/main' && inputs.project == 'migrator'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Prepare Windows executor
        working-directory: migrator
        shell: pwsh
        run: ./executor/build/publish.ps1 -Configuration Release
      - uses: actions/upload-artifact@v6
        with:
          name: executor-windows
          path: migrator/executor/src/bin/Release/net10.0/win-x64/publish/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [native-linux, native-windows]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (inputs.project != 'migrator' ||
      (needs.native-linux.result == 'success' && needs.native-windows.result == 'success'))
    runs-on: ${{ inputs.project == 'regular' && 'windows-latest' || 'ubuntu-24.04' }}
    environment: release
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore .NET tools
        run: dotnet tool restore
      - uses: actions/download-artifact@v7
        if: inputs.project == 'migrator'
        with:
          name: executor-linux
          path: migrator/executor/src/bin/Release/net10.0/
      - uses: actions/download-artifact@v7
        if: inputs.project == 'migrator'
        with:
          name: executor-windows
          path: migrator/executor/src/bin/Release/net10.0/win-x64/publish/
      - name: Build migrator package
        if: inputs.project == 'migrator'
        run: |
          chmod 755 executor/src/bin/Release/net10.0/linux-*/publish/Zongsoft.Tools.Migrator.Executor
          dotnet cake --edition Release --target compile
      - name: Build tool package
        if: inputs.project != 'migrator'
        run: dotnet cake --edition Release --target build
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet cake --edition Release --target pack --exclusive
