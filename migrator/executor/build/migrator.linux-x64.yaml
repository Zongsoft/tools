apiVersion: v1
kind: Pod
metadata:
  name: zongsoft-migrator-aot
spec:
  dnsConfig:
    nameservers:
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.8.8
  containers:
  - name: builder
    image: docker.io/rockylinux/rockylinux:9.8
    command: ["/bin/bash"]
    args:
    - "-c"
    - "exec sleep infinity"
    workingDir: /workspace
    volumeMounts:
    - mountPath: /workspace
      name: migrator
    - mountPath: /.editorconfig
      name: editorconfig
      readOnly: true
    - mountPath: /Directory.Build.props
      name: build-properties
      readOnly: true
    - mountPath: /Directory.Packages.props
      name: package-versions
      readOnly: true
    - mountPath: /aot
      name: build-cache
  volumes:
  - name: migrator
    hostPath:
      path: /mnt/d/Zongsoft/tools/migrator
      type: Directory
  - name: editorconfig
    hostPath:
      path: /mnt/d/Zongsoft/tools/.editorconfig
      type: File
  - name: build-properties
    hostPath:
      path: /mnt/d/Zongsoft/tools/Directory.Build.props
      type: File
  - name: package-versions
    hostPath:
      path: /mnt/d/Zongsoft/tools/Directory.Packages.props
      type: File
  - name: build-cache
    persistentVolumeClaim:
      claimName: zongsoft-migrator-aot-cache
